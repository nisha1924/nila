<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Welcome to My Website</h1>
        <p>My first website hosted with GitHub Pages</p>
    </header>

    <main>
        <h2>Hello! 👋</h2>
        <p>This is a simple static website created with HTML and CSS.</p>
        <button onclick="showMessage()">Click Me</button>
        <p id="message"></p>
    </main>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

    <script>
        function showMessage() {
            document.getElementById("message").textContent =
                "Welcome! Your website is working successfully.";
        }
    </script>
</body>
</html>
